; Re-opens the image's [www] pool to override process manager settings.
;
; Sizing rule: pm.max_children is the RAM available to PHP divided by the
; average worker RSS, which runs 50-100 MB for Nextcloud. Exhausting the pool
; is what produces 502 and 504 responses under load, so revisit this once
; there is real usage to measure.

[www]
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 16
pm.max_requests = 500

pm.status_path = /status
ping.path = /ping

; Surface slow requests instead of guessing at them
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
