; Nextcloud PHP tuning. Memory and upload limits come from PHP_MEMORY_LIMIT and
; PHP_UPLOAD_LIMIT on the container, so only OPcache and APCu live here.
; Values follow the Nextcloud server tuning documentation, raised for a real
; instance: if any OPcache limit exceeds 90% of its allocation the admin
; overview page will say so.

opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=20000
opcache.save_comments=1
opcache.revalidate_freq=60

; Required, or the cron container cannot use the local APCu cache.
apc.enable_cli=1

; PHP session handler. The image entrypoint normally writes this from
; REDIS_HOST, but it cannot create files in this directory when the container
; runs as www-data, so it is provided here instead. Values match what the
; entrypoint would have generated for an unauthenticated Redis on pod loopback.
session.save_handler = redis
session.save_path = "tcp://localhost:6379"
redis.session.locking_enabled = 1
redis.session.lock_retries = -1
; microseconds: wait 10ms before retrying the lock rather than the default 2ms
redis.session.lock_wait_time = 10000
